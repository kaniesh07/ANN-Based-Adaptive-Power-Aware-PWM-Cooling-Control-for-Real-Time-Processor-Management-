; PlatformIO project configuration
; ANN-Based Adaptive Power-Aware PWM Cooling Control
; Board: ESP32-WROOM-32 DevKit V1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit INA219 @ ^1.2.1
    adafruit/Adafruit BusIO @ ^1.14.1
    ; NOTE: without a TFLite Micro library the ANN silently compiles out
    ; (ann_valid=0 in every row). The fan does NOT need it in RULE_BASED
    ; mode. Once the fan is running, uncomment the next line to get the ANN
    ; predictions logged too (if it fails to build, comment it back out).
    ; tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

build_flags =
    -D CORE_DEBUG_LEVEL=1
